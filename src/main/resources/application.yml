spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/queuebridge}
    username: ${DB_USER:queuebridge}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    username: ${RABBIT_USER:queuebridge}
    password: ${RABBIT_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 4
        auto-startup: ${WORKER_ENABLED:false}
  servlet:
    session:
      timeout: 20m
server:
  tomcat:
    max-http-form-post-size: 16KB
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
queuebridge:
  demo: ${DEMO_ENABLED:false}
  publisher: ${WORKER_ENABLED:false}
  operator-password: ${OPERATOR_PASSWORD}
  admin-password: ${ADMIN_PASSWORD}
